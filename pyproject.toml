[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coolhand"
version = "0.4.3"
description = "A Python SDK for monitoring and analyzing AI API interactions with LLM services"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Michael Carroll", email = "team@coolhandlabs.com" },
]
maintainers = [
    { name = "Michael Carroll", email = "team@coolhandlabs.com" },
]
keywords = [
    "ai",
    "llm",
    "api",
    "monitoring",
    "analytics",
    "openai",
    "anthropic",
    "claude",
    "gpt",
    "gemini",
    "google",
    "github-copilot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=3.7.0",
    "certifi>=2017.4.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "twine>=5.0.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=1.0.0",
    "requests>=2.25.0",
    "httpx>=0.20.0",
    "dramatiq>=1.15.0",
    "pydantic-ai>=0.0.14",
]

[project.urls]
Homepage = "https://github.com/Coolhand-Labs/coolhand-python"
Repository = "https://github.com/Coolhand-Labs/coolhand-python.git"
"Bug Tracker" = "https://github.com/Coolhand-Labs/coolhand-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/coolhand"]

[tool.hatch.build.targets.sdist]
include = [
    "src/coolhand",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
extend-ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["coolhand"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402", "E501", "B904", "UP036"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "requests.*",
    "httpx.*",
    "urllib3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "asyncio: Async tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]